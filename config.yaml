http:
  base_url: "https://barabledata.khu.ac.kr/api/ingest"
  shared_key: "CHANGE_ME"      # must match dashboard/backend config.yaml ingest.shared_key

station:
  id: "CHANGE_ME"             # set per laptop when deployed at a station

pam:
  enabled: true
  sensor_type: PAM             # see docs/PAM-데이터-연동-매뉴얼.md
  source_dir: ""               # blank = "<user home>/Desktop/PAM data"
  interval_seconds: 86400      # daily
  columns:                     # see docs/PAM-데이터-연동-매뉴얼.md section 4
    channel: Channel
    doy: DOY
    time_sec: TimeSec
    timestamp: null
  timestamp_format: "%Y-%m-%dT%H:%M:%S"
  year_override: null
